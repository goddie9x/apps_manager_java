plugins {
    id 'com.android.application'
    alias(libs.plugins.kotlin.android)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

// Release signing: environment variables win (CI), local.properties is the local fallback.
// Never commit keystore credentials; local.properties is gitignored.
def signingValue = { String envName, String propName ->
    System.getenv(envName) ?: localProperties.getProperty(propName)
}

android {
    namespace 'com.god.ApplicationManager'
    compileSdk 36

    signingConfigs {
        release {
            def ksPath = signingValue('KEYSTORE_PATH', 'keystore.path')
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword signingValue('KEYSTORE_PASSWORD', 'keystore.password')
                keyAlias signingValue('KEY_ALIAS', 'key.alias')
                keyPassword signingValue('KEY_PASSWORD', 'key.password')
            }
        }
    }

    defaultConfig {
        applicationId 'com.god.ApplicationManager'
        minSdk 24
        targetSdk 36
        versionCode 18
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.recyclerview
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.room.runtime
    annotationProcessor libs.androidx.room.compiler
    implementation libs.androidx.work.runtime.ktx
    implementation libs.shizuku.api
    implementation libs.shizuku.provider
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.runtime.ktx

    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
}
